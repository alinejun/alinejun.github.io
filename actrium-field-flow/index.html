      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},

      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {

      }),

  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */

                return;
              }

              if (pending != null) {
                pendingStateWrites.delete(id);

        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {

    }

    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {

      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;

        id = decodeURIComponent(href.slice(1));

      }

      const sequenceViews = {
        invite:{
          title:&quot;Realm Invite · 生成与交付&quot;, sequenceTitle:&quot;邀请时序&quot;, rows:issuingRows,
          actors:[[&quot;签发方 Host&quot;,&quot;已登记的 Realm client key&quot;],[&quot;AFP · Membership&quot;,&quot;afp.develenv.com&quot;],[&quot;接收方&quot;,&quot;接收 ri_ 文本&quot;]]
        },
        join:{
          title:&quot;Realm Join · 使用邀请加入 Realm&quot;, sequenceTitle:&quot;加入时序&quot;, rows:joiningRows,
          actors:[[&quot;接收方 Host&quot;,&quot;本地 Realm client key&quot;],[&quot;Realm domain&quot;,&quot;realm.develenv.com&quot;],[&quot;AFP · Membership&quot;,&quot;afp.develenv.com&quot;]]
        }
      };
      const diagramSelection = {

      const deployedCli = &quot;/opt/loran-develenv/bin/actr&quot;;

      const inviteCommands = {

      function plainCodeBlock(text,language) {
